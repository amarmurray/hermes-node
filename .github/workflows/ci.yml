name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Offline Tests
      GIT_AUTHOR_EMAIL: offline-tests@example.invalid
      GIT_COMMITTER_NAME: Offline Tests
      GIT_COMMITTER_EMAIL: offline-tests@example.invalid
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests (no live providers)
        run: python -m unittest discover -s tests -v
      - name: Run offline demonstration
        run: python scripts/offline_demo.py
